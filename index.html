<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON to Course</title>
    <link rel="icon" href="static/JSON_vector_logo.svg">
    <link rel="stylesheet" href="styles.css">
    <script src="index.js" defer></script>
</head>
<body>
    <main>
        <header>
            <div>
                <input type="file" name="json-input" id="json-input" accept=".json">
                <button id="file-load-btn">Load Course</button>
                <span id="error-msg"></span>
            </div>
        </header>
        <div id="course">
            <h2 id="course-title"></h2>
            <div id="chapter-list"></div>
        </div>
    </main>
</body>
</html>
